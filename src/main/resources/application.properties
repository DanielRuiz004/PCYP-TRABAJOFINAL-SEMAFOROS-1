spring.application.name=PCYP-TRABAJOFINAL-SEMAFOROS-1
server.port=${PORT:8080}

# render las inyecta el usuario y contrasenia por variables de entorno.
# Los valores despues de ":" son solo para ejecutar de forma local.
# url de base de datos
# usuario de la base de datos
# contrasenia de la base de datos
# conexiones maximas por el limite de 5 conexiones de Clever Cloud el servidor en la nube de la DB
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/pcyp}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pcyp2026}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pcyp2026}
spring.datasource.hikari.maximum-pool-size=2

spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true