spring.application.name=PCYP-TRABAJOFINAL-SEMAFOROS-1
server.port=${PORT:8080}

# Sin credenciales: Render las inyecta por variables de entorno.
# Los valores después de ":" son solo para desarrollo local.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/butacas}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:pcyp2026}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:pcyp2026}
spring.datasource.hikari.maximum-pool-size=2

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true